# -----------------------------------------------------
# Layouts
# -----------------------------------------------------

# Previously only set at runtime by
# ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh (the ml4w Settings app's
# live patch) -- baked in here now that that app is being removed.
general {
    border_size = 2
    gaps_out = 0
    gaps_in = 0
    gaps_workspaces = 0
}

dwindle {
    #pseudotile = true
    preserve_split = true
}

master {
    # Commented out due to compatibility reasons
    # new_status = master
}

binds {
  workspace_back_and_forth = false
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}
