# Start Listeners
exec-once=~/.config/ml4w/listeners.sh --startall

# Start awww wallpaper daemon -- generic Wayland wallpaper daemon, still
# required regardless of shell profile (Noctalia's own wallpaper picker and
# `noctalia msg wallpaper-set` both render through it too).
exec-once = awww-daemon

# Load cursor
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper and Quickshell
exec-once = ~/.config/ml4w/scripts/ml4w-autostart

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Start the shell profile's daemons (swaync+hypridle for ml4w, or noctalia --
# see ~/.config/ml4w/settings/shell-profile). NOT conf/autostart.lua: that
# file's branching logic looks right but is dead code -- Hyprland loads this
# plain .conf tree (hyprland.conf sources conf/autostart.conf), and the Lua
# config entry point that would ever require() the .lua tree is disabled
# (~/.config/hypr/hyprland.lua.disabled). Fix lives here instead, reusing
# switch-shell-profile.sh so login and live-switching share one code path.
exec-once = ~/.config/hypr/scripts/autostart-shell.sh

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# The ML4W Hyprland Settings App (and its runtime border_size/gaps patch via
# com.ml4w.hyprlandsettings/hyprctl.sh) was retired -- those values are now
# baked directly into conf/layouts/default.conf.
