# Start Listeners
exec-once=~/.config/hypr/scripts/listeners.sh --startall

# Start awww wallpaper daemon -- generic Wayland wallpaper daemon, still
# required regardless of shell profile (Noctalia's own wallpaper picker and
# `noctalia msg wallpaper-set` both render through it too).
exec-once = awww-daemon

# Load cursor
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper and Quickshell
exec-once = ~/.config/hypr/scripts/start-quickshell-panels.sh

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Start Noctalia and make sure nothing from the retired ml4w/waybar profile
# is lingering. (The parallel Lua config tree that used to shadow this one
# was confirmed dead -- its entry point was already renamed to
# hyprland.lua.disabled -- and has since been deleted entirely.)
exec-once = ~/.config/hypr/scripts/switch-shell-profile.sh

# cliphist was dropped: $mainMod,V now opens Noctalia's own native clipboard
# panel (backed by its own store under ~/.local/state/noctalia/clipboard),
# so the separate wl-paste/cliphist watcher was just running for nothing.

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# The ML4W Hyprland Settings App (and its runtime border_size/gaps patch via
# com.ml4w.hyprlandsettings/hyprctl.sh) was retired -- those values are now
# baked directly into conf/layouts/default.conf.
